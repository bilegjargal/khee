# Publishes Storybook to GitHub Pages as a live demo of the latest release.
#
# Runs after every npm publish (called from release.yml) and on demand.
# Either way it builds the latest released tag, so the site always matches
# what is on npm, never unreleased work on main.
#
# Split into jobs like release.yml: the job that installs and builds code
# never gets id-token: write; the job that deploys never builds.
name: Pages

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: build storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the latest release
        run: |
          tag="$(git tag --list '@khee/react@*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::error::No @khee/react release tag found."
            exit 1
          fi
          echo "Building Storybook for $tag"
          git checkout --quiet "$tag"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache (cache poisoning), same as release.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@khee/storybook
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/storybook/storybook-static

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment source (OIDC)
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
